name: 'C++ CI'

on:
  push:
    branches:
      - main
      - feature/github_actions
      - lab2 

permissions: write-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install Boost (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-test-dev

      - name: Install Boost (Windows)
        if: runner.os == 'Windows'
        run: C:/vcpkg/vcpkg.exe install boost-test:x64-windows

      - name: Configure (Linux)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DPATCH_VERSION=${{ github.run_number }}

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build -DPATCH_VERSION=${{ github.run_number }} -DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        run: cmake --build build --config Release

      - name: Run program (Linux)
        if: runner.os != 'Windows'
        run: ./build/helloworld_cli

      - name: Run program (Windows)
        if: runner.os == 'Windows'
        run: ./build/Release/helloworld_cli.exe

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        working-directory: build
        run: cpack -C Release

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ runner.os }}
          path: |
            build/helloworld-*.deb
            build/helloworld-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.${{ github.run_number }} --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release delete v1.0.${{ github.run_number }} --repo "${{ github.repository }}" --yes --cleanup-tag
          fi
          gh release create v1.0.${{ github.run_number }} dist/* \
            --repo "${{ github.repository }}" \
            --title "Release 1.0.${{ github.run_number }}" \
            --notes "Automated build #${{ github.run_number }}"
